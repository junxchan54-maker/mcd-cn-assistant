<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="小红书风晒单卡片：减脂期麦当劳 429 大卡组合">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6EF"/>
      <stop offset="100%" stop-color="#FFEDE2"/>
    </linearGradient>
    <linearGradient id="kcalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2442"/>
      <stop offset="100%" stop-color="#FF7A59"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFDFA"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#C2410C" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="900" height="1200" fill="url(#bgGrad)"/>

  <!-- 顶部标签条 -->
  <rect x="56" y="56" width="272" height="46" rx="23" fill="#FF2442"/>
  <text x="76" y="86" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">麦当劳 · 减脂期实测</text>
  <rect x="344" y="56" width="180" height="46" rx="23" fill="#FFFFFF" stroke="#FF2442" stroke-width="2"/>
  <text x="366" y="86" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#FF2442">429 大卡</text>

  <!-- 主标题 -->
  <text x="60" y="176" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="62" font-weight="800" fill="#3B1006">双层吉士 + 无糖可乐</text>
  <text x="60" y="246" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="600" fill="#9A3412">429 大卡 · 蛋白质 27g · 到店 ¥37.50</text>

  <!-- 热量主卡 -->
  <rect x="60" y="282" width="780" height="216" rx="28" fill="url(#cardGrad)" filter="url(#soft)"/>
  <text x="92" y="352" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#7C2D12">总热量</text>
  <text x="92" y="440" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="92" font-weight="800" fill="url(#kcalGrad)">429</text>
  <text x="316" y="440" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#7C2D12">大卡</text>
  <rect x="430" y="330" width="1.5" height="130" fill="#FED7AA"/>
  <text x="466" y="366" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" fill="#7C2D12">目标 ≤ 450 大卡</text>
  <text x="466" y="404" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" fill="#7C2D12">达标余量 21 大卡</text>
  <text x="466" y="442" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#15803D">蛋白质 27g ≥ 25g 达标</text>

  <!-- 营养素条形图 -->
  <rect x="60" y="528" width="780" height="232" rx="28" fill="url(#cardGrad)" filter="url(#soft)"/>
  <text x="92" y="576" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#7C2D12">三大营养素</text>

  <!-- 蛋白质 -->
  <text x="92" y="622" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#3B1006">蛋白质</text>
  <rect x="196" y="606" width="520" height="22" rx="11" fill="#FEE2E2"/>
  <rect x="196" y="606" width="468" height="22" rx="11" fill="#FF2442"/>
  <text x="726" y="623" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#3B1006">27g</text>

  <!-- 脂肪 -->
  <text x="92" y="664" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#3B1006">脂　肪</text>
  <rect x="196" y="648" width="520" height="22" rx="11" fill="#FEF3C7"/>
  <rect x="196" y="648" width="312" height="22" rx="11" fill="#F59E0B"/>
  <text x="726" y="665" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#3B1006">22g</text>

  <!-- 碳水 -->
  <text x="92" y="706" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#3B1006">碳　水</text>
  <rect x="196" y="690" width="520" height="22" rx="11" fill="#DBEAFE"/>
  <rect x="196" y="690" width="404" height="22" rx="11" fill="#3B82F6"/>
  <text x="726" y="707" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#3B1006">31g</text>

  <!-- 餐品与价格 -->
  <rect x="60" y="790" width="780" height="176" rx="28" fill="url(#cardGrad)" filter="url(#soft)"/>
  <text x="92" y="834" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#3B1006">双层吉士汉堡</text>
  <text x="560" y="834" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#3B1006">429 大卡 / 27g 蛋白</text>
  <text x="796" y="834" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#3B1006">¥26.50</text>
  <text x="92" y="876" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" fill="#3B1006">无糖可口可乐（中杯）</text>
  <text x="560" y="876" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#15803D">0 大卡 / 0g 糖</text>
  <text x="796" y="876" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#3B1006">¥11.00</text>
  <line x1="92" y1="898" x2="796" y2="898" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="92" y="936" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#FF2442">合计</text>
  <text x="796" y="936" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="800" fill="#FF2442">¥37.50</text>

  <!-- 对比区 -->
  <rect x="60" y="996" width="780" height="104" rx="24" fill="#FFF1F2" stroke="#FECDD3" stroke-width="2"/>
  <text x="92" y="1036" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#9F1239">同价位平替：麦辣鸡腿汉堡 ¥26.00 = 485 大卡 / 24g 蛋白</text>
  <text x="92" y="1074" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" fill="#BE123C">换成双层吉士：少 56 大卡，多 3g 蛋白，还便宜 5 毛思路</text>

  <!-- 小红书文案 -->
  <rect x="60" y="1128" width="780" height="0" rx="0" fill="none"/>
  <text x="60" y="1168" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#3B1006">减脂期也能吃麦当劳尊嘟不骗人！429 大卡蛋白质 27g，姐妹们快冲！</text>
</svg>
